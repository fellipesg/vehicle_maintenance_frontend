name: vehicle_maintenance
description: Aplicativo mobile para registro de manutenções de veículos
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP Client
  http: ^1.1.0
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # File Handling
  file_picker: ^8.0.0
  path_provider: ^2.1.1
  pdf: ^3.10.7
  printing: ^5.12.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  
  # Forms & Validation (removed - not currently used)
  
  # Date & Time
  intl: ^0.18.1
  
  # Utils
  url_launcher: ^6.2.2
  
  # WebView for OAuth
  webview_flutter: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # Assets commented out until they are created
